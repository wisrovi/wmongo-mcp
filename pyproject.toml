[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wmongo-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for WMongo MongoDB architecture and code generation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "WILLIAM R.", email = "william@ecapturedtech.com"}
]
keywords = ["mcp", "wmongo", "mongodb", "ai-agent", "fastmcp", "architecture"]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
wmongo-mcp = "wmongo_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
